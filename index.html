<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>하루장</title>
<meta name="theme-color" content="#eceff0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1719" media="(prefers-color-scheme: dark)">
<meta name="description" content="하루의 중요한 일과 할 일을 사진과 함께 남기는 개인 기록장">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 단일 열 모바일 앱. 위에 오늘 날짜와 4개 빠른 기록 버튼, 아래로 날짜별 타임라인. 하단 탭 3개 + 새 기록 버튼. */
:root{
  --bg:#eceff0; --card:#f8faf9; --ink:#17262a; --ink2:#566a6b; --line:#d3dbdb; --fill:#e3e9e9;
  --brand:#1d3f45; --on-brand:#f2f7f6;
  --c-key:#c24d22; --k-blue:#2f64a8; --k-green:#4d7a22; --k-plum:#9a3f70; --k-teal:#17766f; --k-ochre:#a8751a; --k-rose:#c0405a; --k-persimmon:#c24d22; --k-slate:#5d6b73;
  --shadow:0 1px 2px rgba(23,38,42,.06),0 6px 18px rgba(23,38,42,.06);
  --serif:"Gowun Batang","Noto Serif KR","Nanum Myeongjo",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --card:#172224; --ink:#e4eeee; --ink2:#9db2b2; --line:#2a3a3c; --fill:#223032;
  --brand:#cfe6e3; --on-brand:#0f1719;
  --c-key:#f09a74; --k-blue:#7fb0ea; --k-green:#9fcf62; --k-plum:#e08dbb; --k-teal:#6fd0c6; --k-ochre:#e3b45a; --k-rose:#f08aa0; --k-persimmon:#f09a74; --k-slate:#a3b1b8;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --card:#172224; --ink:#e4eeee; --ink2:#9db2b2; --line:#2a3a3c; --fill:#223032;
  --brand:#cfe6e3; --on-brand:#0f1719;
  --c-key:#f09a74; --k-blue:#7fb0ea; --k-green:#9fcf62; --k-plum:#e08dbb; --k-teal:#6fd0c6; --k-ochre:#e3b45a; --k-rose:#f08aa0; --k-persimmon:#f09a74; --k-slate:#a3b1b8;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);padding-inline:16px;padding-top:env(safe-area-inset-top,0px);padding-bottom:132px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
svg{display:block}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{max-width:520px;margin-inline:auto}
.ico{width:1em;height:1em}

.top{display:flex;justify-content:space-between;align-items:center;padding-block:14px 0}
.brand{font:700 15px var(--serif);letter-spacing:.06em;color:var(--ink2)}
.pill{font-size:11px;color:var(--ink2);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.today{padding-block:10px 4px}
.date{margin:0;font:400 36px/1.15 var(--serif);text-wrap:balance}
.date .wd{display:block;margin-top:4px;font:400 15px var(--sans);color:var(--ink2)}
.sub{margin:10px 0 0;color:var(--ink2);font-size:14px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.q{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:13px 4px 11px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--c);font:500 13px var(--sans)}
.q svg{width:26px;height:26px}
.q span{color:var(--ink)}
.q b{position:absolute;top:6px;right:9px;font:700 11px var(--sans);font-variant-numeric:tabular-nums}

.chips{display:flex;gap:6px;overflow-x:auto;padding-block:16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip-f{flex:none;padding:6px 14px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);font:500 13px var(--sans)}
.chip-f[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.chip-day{display:inline-flex;gap:6px;align-items:center;margin-top:8px;padding:4px 12px;border-radius:99px;background:var(--fill);font-size:13px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.5}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.search{margin-top:8px}

.day{display:flex;align-items:baseline;gap:8px;margin:24px 0 8px;font:700 18px var(--serif)}
.day small{font:400 13px var(--sans);color:var(--ink2)}
.day em{margin-left:auto;font:400 12px var(--sans);font-style:normal;color:var(--ink2)}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 13px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer}
.card-head{display:flex;align-items:center;gap:8px;font-size:12px}
.tag-cat{display:inline-flex;align-items:center;gap:5px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);padding:2px 10px 2px 7px;border-radius:99px;font-weight:700}
.tag-cat svg{width:13px;height:13px}
.time{color:var(--ink2);font-variant-numeric:tabular-nums}
.sample{margin-left:auto;font-size:11px;color:var(--ink2);border:1px dashed var(--line);border-radius:6px;padding:0 6px}
.stars-s{margin-left:auto;color:var(--c-key);letter-spacing:2px;font-size:13px}
.card h3{margin:7px 0 2px;font:700 17px/1.35 var(--serif);text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:2px 0;color:var(--ink2);font-size:13px}
.facts span+span::before{content:"·";margin-inline:8px}
.stats{display:flex;flex-wrap:wrap;gap:8px 16px;margin:8px 0 4px}
.stat b{display:block;white-space:nowrap;font:700 20px/1.15 var(--serif);font-variant-numeric:tabular-nums}
.stat b i{font:400 12px var(--sans);font-style:normal;color:var(--ink2);margin-left:2px}
.stat small{font-size:11px;color:var(--ink2)}
.note{margin:6px 0 0;font-size:14px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.thumbs{display:flex;gap:6px;margin-top:9px}
.ph{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--fill)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .more{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);color:#fff;font-weight:700}
.tags{display:flex;gap:4px 8px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink2)}
.empty{margin:36px 0;text-align:center;color:var(--ink2);font-size:14px;text-wrap:balance}

.cal-head{display:flex;align-items:center;justify-content:space-between;padding-block:18px 10px}
.cal-head h2{margin:0;font:700 22px var(--serif)}
.nav-b{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.nav-b svg{width:18px;height:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wh{text-align:center;font-size:12px;color:var(--ink2);padding-block:4px}
.cal .wh:first-child,.cell.sun .n{color:var(--c-key)}
.cell{min-height:54px;border-radius:10px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;padding-top:7px;background:var(--card)}
.cell .n{font-size:14px;font-variant-numeric:tabular-nums}
.cell.today .n{background:var(--brand);color:var(--on-brand);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;margin-top:-3px}
.cell.sel{border-color:var(--brand)}
.dots{display:flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.msum{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.msum h3{margin:0 0 10px;font:700 15px var(--serif)}
.mrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mrow div{color:var(--c)}
.mrow b{display:block;font:700 22px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.mrow small{font-size:12px;color:var(--ink2)}
.mhike{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}

.sec{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.sec h3{margin:0 0 4px;font:700 16px var(--serif)}
.sec p{margin:4px 0 10px;color:var(--ink2);font-size:13.5px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);font:500 14px var(--sans);min-height:42px}
.btn.pri{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.danger{color:var(--c-key);border-color:color-mix(in srgb,var(--c-key) 45%,transparent)}
.btn[disabled]{opacity:.5}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;color:var(--ink2);font-size:11.5px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--brand);font-weight:700}
.fab{position:fixed;z-index:21;right:max(16px,calc((100vw - 520px)/2 + 16px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.28)}
.fab svg{width:26px;height:26px}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,14,15,.55);display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
.sh-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sh-head h2{margin:0;font:700 18px var(--serif)}
.x{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--fill);font-size:22px;line-height:1}
.choose{display:grid;gap:8px}
.pick{display:flex;align-items:center;gap:14px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:14px;color:var(--c);background:var(--bg)}
.pick svg{width:28px;height:28px;flex:none}
.pick b{display:block;color:var(--ink);font:700 16px var(--serif)}
.pick small{color:var(--ink2);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{grid-column:1/-1;display:block;min-width:0}
.fld.half{grid-column:auto}
.lbl{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px;letter-spacing:.02em}
.unit-wrap{position:relative;display:block}
.unit-wrap input{padding-right:46px}
.unit-wrap em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;color:var(--ink2);pointer-events:none}
.dur{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stars{display:flex;gap:6px}
.stars button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);font-size:22px;color:var(--ink2)}
.stars button.on{color:var(--c-key);border-color:var(--c-key);background:color-mix(in srgb,var(--c-key) 12%,transparent)}
.err{color:var(--c-key);font-size:12px}
.strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.strip .ph{width:72px;height:72px}
.strip .ph.busy{display:grid;place-items:center;font-size:11px;color:var(--ink2)}
.rm{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.hint{margin:6px 0 0;font-size:12px;color:var(--ink2)}
.geo{font-size:12px;color:var(--ink2);margin:0}
.geo a{color:var(--brand);text-underline-offset:2px}
.geo button{text-decoration:underline;color:var(--ink2)}
.actions{display:flex;gap:8px;margin-top:4px}
.actions .pri{flex:1}
.vmeta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.vmeta .tag-cat{font-size:12px}
.vtitle{margin:10px 0 4px;font:700 22px/1.35 var(--serif);text-wrap:balance;overflow-wrap:anywhere}
.vnote{margin:12px 0 0;font-size:15px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.vphotos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.vphotos .ph{width:100%;height:auto;aspect-ratio:1}
.vact{margin-top:18px}
.lb{background:rgba(0,0,0,.88);align-items:center}
.lb img{max-width:100%;max-height:86dvh;object-fit:contain}
.lb .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;background:rgba(255,255,255,.2);color:#fff}
.toast{position:fixed;z-index:70;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));max-width:calc(100vw - 32px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;box-shadow:var(--shadow)}

.pill{background:none;font-family:var(--sans)}
.pill.warn{color:var(--c-key);border-color:var(--c-key);font-weight:700}
.sec p b{color:var(--ink)}

.pg{margin:14px 0 0;font:700 26px var(--serif)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.bb{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:14px;border:1px solid var(--line);background:var(--card);font:700 15px var(--sans)}
.bb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bb.pri{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.todos{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 12px}
.grp{margin:10px 0 2px;font:700 12px var(--sans);color:var(--ink2);letter-spacing:.04em}
.todo{display:flex;align-items:center;gap:2px;min-height:40px}
.todo+.todo{border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.chk-w{width:40px;height:40px;display:grid;place-items:center;flex:none;margin-left:-10px}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--ink2);display:grid;place-items:center;color:var(--on-brand)}
.chk.on{background:var(--brand);border-color:var(--brand)}
.chk svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.todo .t{flex:1;min-width:0;text-align:left;padding:6px 0;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.todo.done .t{color:var(--ink2);text-decoration:line-through}
.due{flex:none;font-size:12px;color:var(--ink2);background:var(--fill);border-radius:99px;padding:1px 9px}
.due.late{color:var(--c-key);background:color-mix(in srgb,var(--c-key) 14%,transparent);font-weight:700}
.more-t{display:block;width:100%;padding:9px 0;border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent);color:var(--brand);font:500 13px var(--sans);text-align:center}
.none{margin:8px 0;color:var(--ink2);font-size:14px}
.none.pad{padding:6px 2px}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.cp{display:inline-flex;align-items:center;gap:5px;padding:7px 12px 7px 9px;border-radius:99px;border:1px solid var(--line);font:500 13.5px var(--sans);color:var(--ink2)}
.cp svg{width:15px;height:15px;color:var(--c)}
.cp.on{color:var(--c);border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);font-weight:700}
.clist{display:grid;gap:8px;margin-bottom:12px}
.crow{display:flex;align-items:center;gap:10px}
.cdot{width:34px;height:34px;border-radius:50%;background:var(--c);flex:none;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.cname{flex:1}
.cn{font-size:12px;color:var(--ink2);min-width:32px;text-align:right}
.cdel{width:36px;height:36px;border-radius:50%;background:var(--fill);font-size:20px;line-height:1;flex:none}
.cdel.arm{width:auto;padding:0 12px;font-size:13px;font-weight:700;color:var(--c-key);background:color-mix(in srgb,var(--c-key) 14%,transparent);border-radius:99px}
.cdel.off{background:none;pointer-events:none}
.swatches{display:flex;flex-wrap:wrap;gap:10px;padding:2px 0 6px 44px}
.sw{width:32px;height:32px;border-radius:50%;background:var(--c);border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.chip-f.edit{border-style:dashed}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{font-size:13px;padding:3px 11px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.mchip b{font-variant-numeric:tabular-nums}
.legend{display:flex;align-items:center;gap:6px;margin:10px 2px 0;font-size:12px;color:var(--ink2)}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--ink2);display:inline-block}
.dots i.ring,.legend i.ring{background:none;border:1.5px solid var(--ink2);width:7px;height:7px}
.dots i.ring{width:6px;height:6px;border-width:1.5px}
.duerow{display:flex;gap:6px;flex-wrap:wrap}
.duerow input{flex:1 1 140px;width:auto}
.duerow .btn{padding:8px 12px;min-height:44px}
.snack{position:fixed;z-index:75;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));width:calc(100vw - 32px);max-width:488px;display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:14px;box-shadow:var(--shadow);font-size:14px}
.snack span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snack button{padding:8px 12px;border-radius:10px;font-weight:700;color:var(--bg)}
.snack button.ok{background:color-mix(in srgb,var(--bg) 22%,transparent)}
.mrow,.mhike,.quick{display:none}
.today{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 0}
.today .date{font-size:27px;line-height:1.1;white-space:nowrap}
.today .date .wd{margin-top:2px;font-size:14px}
.today .big{margin:0;width:196px;max-width:100%;min-width:0;grid-template-columns:1fr 1fr;gap:6px;flex:0 1 196px}
.today .bb{min-height:44px;border-radius:12px;font-size:13px;gap:3px;padding:0 4px;white-space:nowrap}
.today .bb svg{width:15px;height:15px;flex:none}
.top{padding-block:8px 0}
.day{margin-top:16px}
.xc{display:contents}
.actions.stick{position:sticky;bottom:0;z-index:2;background:var(--card);margin-top:0;padding:10px 0 calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 10px -10px rgba(0,0,0,.2)}
.dtline,.xfold{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:44px;padding:0 14px;border-radius:10px;text-align:left}
.dtline{border:1px solid var(--line);background:var(--bg);font-size:15px;font-variant-numeric:tabular-nums}
.dtline .ed{font-size:12.5px;color:var(--ink2)}
.xfold{border:1px dashed var(--line);font-size:14px;color:var(--ink2)}
.dtgrid,.xbody{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.dtgrid label{display:block;min-width:0}
.imp{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 18px;border-radius:99px;border:1px solid var(--line);font:500 14px var(--sans);color:var(--ink2)}
.imp.on{color:var(--c-key);border-color:var(--c-key);background:color-mix(in srgb,var(--c-key) 12%,transparent);font-weight:700}
.hsave{margin-left:auto;height:36px;padding:0 18px;border-radius:99px;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:14px}
.hsave[disabled]{opacity:.5}
.hsave+.x{margin-left:0}
.ptrow{display:flex;align-items:flex-end;gap:8px}
.ptp{flex:1;min-width:0;display:block}
.ptp input{height:44px}
.ptbtn{flex:none;display:block}
.ptime{height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.xchips{display:flex;flex-wrap:wrap;gap:6px}
.xchip{padding:7px 13px;border-radius:99px;border:1px dashed var(--line);font:500 13.5px var(--sans);color:var(--ink2)}
.xchip.on{border-style:solid;border-color:var(--brand);color:var(--brand);font-weight:700}
.xchip[aria-expanded="true"]{background:var(--fill)}
#f-note{resize:none;overflow-y:auto;min-height:calc(4*1.5em + 22px)}
.scrim.mid{align-items:center;padding:16px}
.scrim.mid .panel{max-height:78dvh;border-radius:20px}
.cp.more{color:var(--ink2);border-style:dashed;padding-left:12px}
.cfb{flex:none;height:36px;padding:0 11px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.cfb.on{color:var(--brand);border-color:var(--brand);font-weight:700}
.fpanel{padding:2px 0 10px 44px}
.fpanel .fh{margin:0 0 8px;font-size:12px;color:var(--ink2)}
.ftoggles{display:flex;flex-wrap:wrap;gap:6px}
.ft{padding:7px 12px;border-radius:99px;border:1px solid var(--line);font:500 13px var(--sans);color:var(--ink2)}
.ft.on{color:var(--c);border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);font-weight:700}
.ft.on::before{content:"✓ "}
.msum2{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.dur-out{min-height:44px;display:flex;align-items:center;padding:0 12px;border:1px dashed var(--line);border-radius:10px;font:700 16px var(--sans);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="app"><div id="view"></div></div>

<button class="fab" id="fab" data-act="rec-new" aria-label="기록 남기기">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
<nav class="tabbar" aria-label="화면 전환"><div class="tabs">
  <button class="tab" data-act="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>오늘</button>
  <button class="tab" data-act="tab" data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>기록</button>
  <button class="tab" data-act="tab" data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>달력</button>
  <button class="tab" data-act="tab" data-tab="arch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1zM3 4h18v4H3zM10 12h4"/></svg>보관</button>
</div></nav>

<div class="scrim" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true" aria-label="입력"></div></div>
<div class="scrim lb" id="lb" hidden data-act="lb-close"><button class="x" data-act="lb-close" aria-label="닫기">×</button><img id="lb-img" alt="확대한 사진"></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="snack" id="snack" hidden role="status"><span id="snack-t"></span><button class="ok" data-act="snack-ok">기록하기</button><button data-act="snack-no" aria-label="닫기">×</button></div>
<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const pYmd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const addDays=(s,n)=>{const d=pYmd(s);d.setDate(d.getDate()+n);return ymd(d);};
const fmt=n=>Number(n).toLocaleString('ko-KR');
const WD=['일','월','화','수','목','금','토'];
const SVG=p=>'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
const ICON_PATH={
  out:'<path d="M12 21s-6-5.2-6-10a6 6 0 1 1 12 0c0 4.8-6 10-6 10z"/><circle cx="12" cy="11" r="2"/>',
  meet:'<circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/>',
  hike:'<path d="M3 19l6.5-11 3.5 6 2-3L21 19z"/>',
  read:'<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v15H5.5A1.5 1.5 0 0 0 4 20.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v15h5.5a1.5 1.5 0 0 1 1.5 1.5z"/>',
  shop:'<path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/>',
  trip:'<path d="M21 4L3 11l6 2.5L11.5 20l2.5-5.5zM9 13.5L21 4"/>',
  etc:'<circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/>',
  tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>'
};
const icon=id=>SVG(ICON_PATH[id]||ICON_PATH.tag);
const CHECK=SVG('<path d="M5 12.5l4.5 4.5L19 7.5"/>');
const COLORS=['blue','green','plum','teal','ochre','rose','persimmon','slate'];
const DEFAULT_CATS=[
  {id:'out',name:'외출',color:'blue',fields:[]},{id:'hike',name:'등산',color:'green',fields:['end','dist']},{id:'trip',name:'여행',color:'rose',fields:['cost']},{id:'meet',name:'만남',color:'plum',fields:[]},
  {id:'read',name:'독서',color:'teal',fields:['author']},{id:'shop',name:'장보기',color:'ochre',fields:['cost']},{id:'etc',name:'기타',color:'slate',fields:[]}
];
/* 공통 항목(장소·날짜·시간·메모·사진)은 모든 분류에 고정. 아래는 분류마다 켜고 끄는 선택 항목 */
const FIELD_DEFS={end:'시작·종료·소요시간',dist:'거리',cost:'비용',author:'저자'};
const FIELD_ORDER=['end','dist','cost','author'];
const FIELD_SHORT={end:'종료',dist:'거리',cost:'비용',author:'저자'};
const XKEY={end:'end',dist:'distKm',cost:'cost',author:'author'};
const PRESETS=[
  {fields:['end','dist'],re:/등산|산행|등반|트레킹|운동|헬스|달리기|러닝|걷기|조깅|자전거|사이클|수영/},
  {fields:['cost'],re:/여행|출장|쇼핑|장보기|구매/},
  {fields:['author'],re:/독서|책|도서/}
];
const ID_PRESET={hike:['end','dist'],trip:['cost'],read:['author'],shop:['cost']};
const presetOf=name=>{const p=PRESETS.find(q=>q.re.test(String(name||'')));return p?p.fields.slice():[];};
const fieldsOf=c=>(c&&Array.isArray(c.fields))?c.fields:((c&&ID_PRESET[c.id])||[]);
const LB_KEY='harujang:lastBackup',LC_KEY='harujang:lastCat';

const S={entries:[],todos:[],cats:DEFAULT_CATS.map(c=>Object.assign({},c)),ready:false,mem:false,
  tab:'today',cat:'all',imp:false,q:'',day:null,cal:{y:new Date().getFullYear(),m:new Date().getMonth()},sheet:null,snack:null,far:false};
const catOf=id=>S.cats.find(c=>c.id===id)||S.cats.find(c=>c.id==='etc')||{id:'etc',name:'기타',color:'slate'};
const colorOf=c=>'var(--k-'+c.color+')';
const byTimeDesc=(a,b)=>((b.date||'')+(b.time||'')).localeCompare((a.date||'')+(a.time||''));
const lsGet=k=>{try{return localStorage.getItem(k);}catch(_){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(_){}};

/* ---------- 폰 안 저장소 (IndexedDB) ---------- */
let idb=null;
const openDb=()=>new Promise((res,rej)=>{
  const r=indexedDB.open('harujang',2);
  r.onupgradeneeded=()=>{
    const d=r.result;
    ['entries','todos'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'});});
    if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'});
  };
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));
});
const idbAll=n=>new Promise((res,rej)=>{const q=idb.transaction(n,'readonly').objectStore(n).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
const idbPut=(n,v)=>new Promise((res,rej)=>{const t=idb.transaction(n,'readwrite');t.objectStore(n).put(v);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});
const idbDel=(n,id)=>new Promise((res,rej)=>{const t=idb.transaction(n,'readwrite');t.objectStore(n).delete(id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});
const upsert=(arr,x)=>{const i=arr.findIndex(y=>y.id===x.id);if(i<0)arr.push(x);else arr[i]=x;};
async function putEntry(e){if(idb)await idbPut('entries',e);upsert(S.entries,e);render();}
async function putTodo(t){if(idb)await idbPut('todos',t);upsert(S.todos,t);render();}
async function delEntry(id){if(idb)await idbDel('entries',id);S.entries=S.entries.filter(x=>x.id!==id);render();}
async function delTodo(id){if(idb)await idbDel('todos',id);S.todos=S.todos.filter(x=>x.id!==id);render();}
async function saveCats(){if(idb)await idbPut('meta',{key:'cats',list:S.cats});}
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const urlCache=new WeakMap();
const urlOf=b=>{if(typeof b==='string')return b;let u=urlCache.get(b);if(!u){u=URL.createObjectURL(b);urlCache.set(b,u);}return u;};
const lastBackup=()=>Number(lsGet(LB_KEY))||0;
const agoText=t=>{const d=Math.floor((Date.now()-t)/864e5);return d<1?'오늘':d+'일 전';};
const needBackup=()=>{const lb=lastBackup();return (S.entries.length+S.todos.length)>=3&&(!lb||Date.now()-lb>14*864e5);};

function ensureEtc(){if(!S.cats.some(c=>c.id==='etc'))S.cats.push({id:'etc',name:'기타',color:'slate',fields:[]});}
function normEntry(e){
  if(!e.f||typeof e.f!=='object')e.f={};
  if(!S.cats.some(c=>c.id===e.cat))e.cat='etc';
  if(!e.star&&e.f.star)e.star=e.f.star;
  if(!Array.isArray(e.photos))e.photos=[];
  return e;
}
async function init(){
  render();
  try{
    idb=await openDb();
    const meta=await idbAll('meta'),m=meta.find(x=>x.key==='cats');
    if(m&&Array.isArray(m.list)&&m.list.length)S.cats=m.list;
    ensureEtc();
    let mig=false;S.cats.forEach(c=>{
      if(!Array.isArray(c.fields)){c.fields=(ID_PRESET[c.id]||[]).slice();mig=true;}
      else if(c.fields.some(k=>!FIELD_ORDER.includes(k))){c.fields=c.fields.filter(k=>FIELD_ORDER.includes(k));mig=true;}
    });
    if(mig){try{await saveCats();}catch(_){}}
    if(lsGet('harujang:tripAdded')!=='1'){
      if(!S.cats.some(c=>c.id==='trip')){const i=S.cats.findIndex(c=>c.id==='etc');S.cats.splice(i<0?S.cats.length:i,0,{id:'trip',name:'여행',color:'rose',fields:['cost']});try{await saveCats();}catch(_){}}
      lsSet('harujang:tripAdded','1');
    }
    S.entries=(await idbAll('entries')).map(normEntry);
    S.todos=await idbAll('todos');
  }catch(_){S.mem=true;toast('이 브라우저에서는 기록을 저장할 수 없습니다. 시크릿 모드인지 확인하세요.');}
  S.ready=true;render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(_){}
}

/* ---------- 설치 ---------- */
let deferred=null;
const isStandalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(S.tab==='arch')render();});
window.addEventListener('appinstalled',()=>{deferred=null;toast('설치했습니다');render();});

/* ---------- helpers ---------- */
let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},2800);}
let snackT=null;
function showSnack(todo){
  S.snack={id:todo.id,title:todo.title};
  $('#snack-t').textContent='"'+todo.title+'" 완료';$('#snack').hidden=false;
  clearTimeout(snackT);snackT=setTimeout(hideSnack,8000);
}
function hideSnack(){S.snack=null;$('#snack').hidden=true;clearTimeout(snackT);}
let layer=false;
const pushLayer=()=>{if(!layer){history.pushState({l:1},'');layer=true;}};
const popLayer=()=>{if(layer){layer=false;history.back();}};
function showLb(src){$('#lb-img').src=src;$('#lb').hidden=false;if(!S.sheet)pushLayer();}
function hideLb(){$('#lb').hidden=true;$('#lb-img').removeAttribute('src');if(!S.sheet)popLayer();}
window.addEventListener('popstate',()=>{
  if(!layer)return;
  layer=false;
  if(!$('#lb').hidden){$('#lb').hidden=true;$('#lb-img').removeAttribute('src');if(S.sheet)pushLayer();}
  else if(S.sheet)closeSheet();
});
const dayLabel=ds=>{const d=pYmd(ds);return (d.getMonth()+1)+'월 '+d.getDate()+'일';};
const dayNote=ds=>{
  const d=pYmd(ds),t=pYmd(ymd(new Date())),diff=Math.round((t-d)/86400000);
  return WD[d.getDay()]+'요일'+(diff===0?' · 오늘':diff===1?' · 어제':'');
};
function dueText(due,td){
  if(!due)return '';
  if(due===td)return '오늘';
  if(due===addDays(td,1))return '내일';
  return dayLabel(due);
}
const durMinOf=(a,b)=>{
  if(!/^\d\d:\d\d$/.test(a||'')||!/^\d\d:\d\d$/.test(b||''))return 0;
  let d=(Number(b.slice(0,2))*60+Number(b.slice(3)))-(Number(a.slice(0,2))*60+Number(a.slice(3)));
  if(d<0)d+=1440;return d;
};
const durText=m=>m?(m>=60?Math.floor(m/60)+'시간':'')+(m%60?(m>=60?' ':'')+(m%60)+'분':''):'';
function legacyFacts(e){
  const f=e.f||{},o=[],en=fieldsOf(catOf(e.cat));
  ['place','purpose','move','who','topics','next','mountain','course','weather','meaning'].forEach(k=>{
    if(f[k]&&!(k==='place'&&f[k]===e.title))o.push(String(f[k]));});
  if(f.spend)o.push(fmt(f.spend)+'원');
  if(f.cost&&en.includes('cost'))o.push(fmt(f.cost)+'원');
  if(f.book)o.push(String(f.book));
  if(f.author&&en.includes('author'))o.push(String(f.author));
  if(f.distKm&&en.includes('dist'))o.push(fmt(f.distKm)+'km');
  if(f.summit)o.push('정상 '+fmt(f.summit)+'m');
  const d=(f.durH||f.durM)?[f.durH?f.durH+'시간':'',f.durM?f.durM+'분':''].filter(Boolean).join(' '):'';
  if(d)o.push(d);
  if(f.gain)o.push('누적 +'+fmt(f.gain)+'m');
  if(f.dest&&f.dest!==e.title)o.push(String(f.dest));
  if(en.includes('end')){
    if(f.end&&e.time)o.push(e.time+'~'+f.end);
    if(f.durMin)o.push(durText(f.durMin));
  }
  return o;
}

/* ---------- views ---------- */
function cardHtml(e){
  const c=catOf(e.cat),ph=e.photos||[],lf=legacyFacts(e);
  let body='';
  if(lf.length)body+='<div class="facts">'+lf.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div>';
  if(e.note)body+='<p class="note">'+esc(e.note)+'</p>';
  if(ph.length){
    body+='<div class="thumbs">'+ph.slice(0,3).map((p,i)=>{
      const more=(i===2&&ph.length>3)?'<span class="more">+'+(ph.length-3)+'</span>':'';
      return '<button type="button" class="ph" data-act="photo" data-id="'+esc(e.id)+'" data-i="'+i+'" aria-label="사진 크게 보기"><img loading="lazy" alt="" src="'+esc(urlOf(p))+'">'+more+'</button>';
    }).join('')+'</div>';
  }
  if(e.tags&&e.tags.length)body+='<div class="tags">'+e.tags.map(t=>'<span>#'+esc(t)+'</span>').join('')+'</div>';
  const star=e.star?'<span class="stars-s" aria-label="중요">★</span>':'';
  return '<div class="card" data-act="rec-open" data-id="'+esc(e.id)+'" tabindex="0" style="--c:'+colorOf(c)+'">'
    +'<div class="card-head"><span class="tag-cat">'+icon(c.id)+esc(c.name)+'</span><span class="time">'+esc(e.time||'')+'</span>'+star+'</div>'
    +'<h3>'+esc(e.title)+'</h3>'+body+'</div>';
}
const CAT_TOP=5;
function catRank(){
  const last={};
  S.entries.forEach(e=>{const t=e.createdAt||e.updatedAt||0;if(!(last[e.cat]>=t))last[e.cat]=t;});
  return S.cats.map((c,i)=>({c:c,t:last[c.id]||0,i:i})).sort((a,b)=>b.t-a.t||a.i-b.i).map(o=>o.c);
}
function catChipsHtml(sh){
  const all=catRank(),many=all.length>CAT_TOP;
  let vis=all;
  if(many&&!sh.catAll){
    vis=all.slice(0,CAT_TOP);
    const sel=all.find(c=>c.id===sh.cat);
    if(sel&&!vis.includes(sel))vis=all.slice(0,CAT_TOP-1).concat(sel);
  }
  return vis.map(c=>'<button type="button" class="cp'+(c.id===sh.cat?' on':'')+'" role="radio" aria-checked="'+(c.id===sh.cat)+'" data-act="setcat" data-id="'+esc(c.id)+'" style="--c:'+colorOf(c)+'">'+icon(c.id)+esc(c.name)+'</button>').join('')
    +(many?'<button type="button" class="cp more" data-act="cat-more" aria-expanded="'+(!!sh.catAll)+'">'+(sh.catAll?'접기 ▴':'더보기 ▾')+'</button>':'');
}
function todoRow(x,td){
  const late=!x.done&&x.due&&x.due<td;
  return '<div class="todo'+(x.done?' done':'')+'"><button type="button" class="chk-w" data-act="todo-toggle" data-id="'+esc(x.id)+'" aria-label="'+(x.done?'완료 취소':'완료로 표시')+'"><span class="chk'+(x.done?' on':'')+'">'+(x.done?CHECK:'')+'</span></button>'
    +'<button type="button" class="t" data-act="todo-edit" data-id="'+esc(x.id)+'">'+esc(x.title)+'</button>'
    +(x.due&&x.due!==td?'<span class="due'+(late?' late':'')+'">'+dueText(x.due,td)+'</span>':'')+'</div>';
}
function todosBlock(td){
  const open=S.todos.filter(x=>!x.done);
  const lim=addDays(td,3);
  const late=open.filter(x=>x.due&&x.due<td).sort((a,b)=>a.due.localeCompare(b.due));
  const seen=new Set(late.map(x=>x.id));
  const now=S.todos.filter(x=>!seen.has(x.id)&&(x.due===td||(!x.due&&!x.done)||(x.done&&x.doneDate===td)))
    .sort((a,b)=>(a.done-b.done)||((a.createdAt||0)-(b.createdAt||0)));
  now.forEach(x=>seen.add(x.id));
  const soon=open.filter(x=>!seen.has(x.id)&&x.due>td&&x.due<=lim).sort((a,b)=>a.due.localeCompare(b.due));
  soon.forEach(x=>seen.add(x.id));
  const far=open.filter(x=>!seen.has(x.id)&&x.due>lim).sort((a,b)=>a.due.localeCompare(b.due));
  const list=late.concat(now.filter(x=>!x.done),soon,S.far?far:[],now.filter(x=>x.done));
  const btn=far.length?'<button type="button" class="more-t" data-act="far-toggle">'+(S.far?'먼 일정 접기':'이후 일정 '+far.length+'개 보기')+'</button>':'';
  return '<h2 class="day"><span>할 일</span><em>'+open.length+'개 남음</em></h2><div class="todos">'
    +(list.length?list.map(x=>todoRow(x,td)).join(''):'<p class="none">'+(far.length?'가까운 할 일이 없습니다.':'할 일이 없습니다.')+'</p>')+btn+'</div>';
}
const hay=e=>[e.title,e.note,catOf(e.cat).name,(e.tags||[]).join(' '),legacyFacts(e).join(' ')].join(' ').toLowerCase();
function filtered(){
  const q=S.q.trim().toLowerCase();
  return S.entries.filter(e=>(S.cat==='all'||e.cat===S.cat)&&(!S.imp||e.star)&&(!q||hay(e).includes(q))).sort(byTimeDesc);
}
function feedHtml(){
  if(!S.ready)return '<p class="empty">기록을 불러오는 중입니다.</p>';
  if(!S.entries.length)return '<p class="empty">아직 기록이 없습니다.<br>오늘 탭이나 + 버튼으로 첫 기록을 남겨 보세요.</p>';
  const list=filtered();
  if(!list.length)return '<p class="empty">조건에 맞는 기록이 없습니다.</p>';
  const g={};list.forEach(e=>{(g[e.date]=g[e.date]||[]).push(e);});
  return Object.keys(g).sort().reverse().map(d=>
    '<h2 class="day"><span>'+dayLabel(d)+'</span><small>'+dayNote(d)+'</small><em>'+g[d].length+'건</em></h2>'+g[d].map(cardHtml).join('')).join('');
}
const topHtml=()=>'<header class="top"><span class="brand">하루장</span>'+(needBackup()?'<button class="pill warn" data-act="tab" data-tab="arch">백업 필요</button>':'')+'</header>';
function viewToday(){
  const t=new Date(),td=ymd(t),recs=S.entries.filter(e=>e.date===td).sort(byTimeDesc);
  return topHtml()
  +'<section class="today"><h1 class="date">'+(t.getMonth()+1)+'월 '+t.getDate()+'일<span class="wd">'+WD[t.getDay()]+'요일</span></h1>'
  +'<div class="big"><button class="bb pri" data-act="rec-new">'+SVG('<path d="M12 5v14M5 12h14"/>')+'기록 남기기</button><button class="bb" data-act="todo-new">'+SVG('<path d="M5 12.5l4.5 4.5L19 7.5"/>')+'할 일 추가</button></div></section>'
  +(S.ready?todosBlock(td):'')

  +(!S.ready?'<p class="empty">불러오는 중입니다.</p>':recs.length?recs.map(cardHtml).join(''):'<p class="none pad">오늘 남긴 기록이 없습니다.</p>');

function viewCal(){
  const y=S.cal.y,m=S.cal.m,first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),td=ymd(new Date());
  const pre=y+'-'+pad(m+1),by={},open={};
  S.entries.forEach(e=>{if(e.date&&e.date.startsWith(pre))(by[e.date]=by[e.date]||new Set()).add(e.cat);});
  S.todos.forEach(x=>{if(x.due&&x.due.startsWith(pre)&&!x.done)open[x.due]=true;});
  let cells=WD.map(w=>'<div class="wh">'+w+'</div>').join('');
  for(let i=0;i<first.getDay();i++)cells+='<span></span>';
  for(let d=1;d<=days;d++){
    const ds=pre+'-'+pad(d),dow=new Date(y,m,d).getDay(),set=by[ds];
    const dots=(set?S.cats.filter(c=>set.has(c.id)).map(c=>'<i style="--c:'+colorOf(c)+'"></i>').join(''):'')+(open[ds]?'<i class="ring"></i>':'');
    cells+='<button class="cell'+(dow===0?' sun':'')+(ds===td?' today':'')+(ds===S.day?' sel':'')+'" data-act="day" data-date="'+ds+'" aria-label="'+(m+1)+'월 '+d+'일"><span class="n">'+d+'</span>'+(dots?'<span class="dots">'+dots+'</span>':'')+'</button>';
  }
  const es=S.entries.filter(e=>e.date&&e.date.startsWith(pre)),ts=S.todos.filter(x=>x.due&&x.due.startsWith(pre));
  const chips=S.cats.map(c=>{const n=es.filter(e=>e.cat===c.id).length;return n?'<span class="mchip" style="--c:'+colorOf(c)+'">'+esc(c.name)+' <b>'+n+'</b></span>':'';}).join('');
  let detail='';
  if(S.day){
    const dr=S.entries.filter(e=>e.date===S.day).sort(byTimeDesc),dt=S.todos.filter(x=>x.due===S.day);
    detail='<h2 class="day"><span>'+dayLabel(S.day)+'</span><small>'+dayNote(S.day)+'</small></h2>'
      +(dt.length?'<div class="todos">'+dt.map(x=>todoRow(x,td)).join('')+'</div>':'')
      +(dr.length?dr.map(cardHtml).join(''):'<p class="none pad">이 날의 기록이 없습니다.</p>');
  }
  let km=0,won=0;
  es.forEach(e=>{const en=fieldsOf(catOf(e.cat));if(en.includes('dist'))km+=Number(e.f.distKm)||0;if(en.includes('cost'))won+=Number(e.f.cost)||0;});
  const sums=(km||won)?'<p class="msum2">'+[km?'거리 합계 '+fmt(Math.round(km*10)/10)+'km':'',won?'비용 합계 '+fmt(won)+'원':''].filter(Boolean).join(' · ')+'</p>':'';
  return topHtml()
  +'<div class="cal-head"><button class="nav-b" data-act="mon" data-d="-1" aria-label="이전 달">'+SVG('<path d="M15 5l-7 7 7 7"/>')+'</button><h2>'+y+'년 '+(m+1)+'월</h2><button class="nav-b" data-act="mon" data-d="1" aria-label="다음 달">'+SVG('<path d="M9 5l7 7-7 7"/>')+'</button></div>'
  +'<div class="cal">'+cells+'</div>'
  +'<p class="legend"><i></i> 기록 <i class="ring"></i> 남은 할 일</p>'
  +'<section class="msum"><h3>이달의 기록 '+es.length+'건'+(ts.length?' · 할 일 '+ts.filter(x=>x.done).length+'/'+ts.length+' 완료':'')+'</h3>'+(chips?'<div class="mchips">'+chips+'</div>':'')+sums+'</section>'
  +detail;
}
function viewArch(){

  const inst=isStandalone()?'<p>설치된 앱으로 실행 중입니다.</p>'
    :deferred?'<p>홈 화면에 아이콘을 만들어 앱처럼 실행합니다.</p><div class="btns"><button class="btn pri" data-act="install">홈 화면에 설치</button></div>'

  +'<section class="sec"><h3>보관 상태</h3><p>기록 '+n+'건 · 사진 '+ph+'장 · 할 일 '+S.todos.length+'개<br>모든 내용은 이 폰의 브라우저 저장소에만 있습니다. 서버로 보내지 않습니다.'+(S.mem?'<br><b>지금은 저장이 꺼져 있어 앱을 닫으면 사라집니다.</b>':'')+'</p></section>'
  +'<section class="sec"><h3>분류</h3><p>외출, 등산 같은 분류의 이름과 색을 바꾸거나 새로 만듭니다.</p><div class="btns"><button class="btn" data-act="cats-open">분류 관리</button></div></section>'
  +'<section class="sec"><h3>백업과 복원</h3><p>마지막 백업: <b>'+(lb?agoText(lb):'아직 없음')+'</b><br>폰을 잃어버리거나 브라우저 데이터를 지우면 기록이 사라집니다. 가끔 백업 파일을 저장해 구글 드라이브나 PC로 옮겨 두세요. 파일은 폰의 다운로드 폴더에 저장됩니다.</p>'
  +'<div class="btns"><button class="btn pri" data-act="export" data-kind="json">백업 파일 저장</button><button class="btn" data-act="export" data-kind="md">읽기용(마크다운) 저장</button><label class="btn">백업 불러오기<input id="imp" type="file" accept=".json,application/json" hidden></label></div></section>'
  +'<section class="sec"><h3>앱 설치</h3>'+inst+'</section>';
}
function render(){
  const v=$('#view');
  v.innerHTML=S.tab==='cal'?viewCal():S.tab==='arch'?viewArch():S.tab==='log'?viewLog():viewToday();
  document.querySelectorAll('.tab').forEach(b=>{if(b.dataset.tab===S.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
}

function dtText(){
  const d=$('#f-date'),t=$('#f-time');if(!d||!t)return '';
  const td=ymd(new Date()),v=d.value||td;
  let lab;
  if(v===td)lab='오늘';else if(v===addDays(td,-1))lab='어제';
  else{const a=pYmd(v);lab=(a.getMonth()+1)+'/'+a.getDate()+'('+WD[a.getDay()]+')';}
  return lab+' '+(t.value||'--:--');
}
function updDt(){const el=$('#dt-text');if(el)el.textContent=dtText();}
const filledX=(x,k)=>!!String(x[k]==null?'':x[k]).trim();
function xChipText(k,x){
  if(k==='end'){const t=$('#f-time'),m=durMinOf(t?t.value:'',x.end);return x.end?('종료 '+x.end+(m?' · '+durText(m):'')):'종료';}
  if(k==='dist')return filledX(x,'dist')?('거리 '+x.dist+'km'):'거리';
  if(k==='cost'){const c=parseFloat(String(x.cost==null?'':x.cost).replace(/,/g,''));return (isFinite(c)&&c>0)?('비용 '+fmt(Math.round(c))+'원'):'비용';}
  if(k==='author')return filledX(x,'author')?('저자 '+x.author):'저자';
  return k;
}
function xRowHtml(k,x){
  if(k==='end')return '<label class="fld half"><span class="lbl">종료시간</span><input id="f-end" type="time" value="'+esc(x.end||'')+'"></label>';
  if(k==='dist')return '<label class="fld half"><span class="lbl">거리</span><span class="unit-wrap"><input id="f-dist" type="number" inputmode="decimal" step="0.1" min="0" value="'+esc(x.dist||'')+'"><em>km</em></span></label>';
  if(k==='cost')return '<label class="fld half"><span class="lbl">비용</span><span class="unit-wrap"><input id="f-cost" type="number" inputmode="numeric" step="100" min="0" value="'+esc(x.cost||'')+'"><em>원</em></span></label>';
  if(k==='author')return '<label class="fld"><span class="lbl">저자</span><input id="f-author" type="text" maxlength="60" placeholder="저자 이름" value="'+esc(x.author||'')+'"></label>';
  return '';
}
function renderExtra(){
  const sh=S.sheet;if(!sh||sh.kind!=='rec')return;
  const chips=$('#xchips'),body=$('#xbody');if(!chips||!body)return;
  const x=sh.x||(sh.x={}),en=fieldsOf(catOf(sh.cat)),op=sh.xopen||(sh.xopen={});
  const ks=FIELD_ORDER.filter(k=>en.includes(k));
  chips.hidden=!ks.length;
  chips.innerHTML=ks.map(k=>'<button type="button" class="xchip'+(filledX(x,k)?' on':'')+'" data-act="x-chip" data-k="'+k+'" aria-expanded="'+(!!op[k])+'">'+esc(xChipText(k,x))+'</button>').join('');
  body.innerHTML=ks.filter(k=>op[k]).map(k=>xRowHtml(k,x)).join('');
  body.hidden=!body.innerHTML;
  const ti=$('#f-title');if(ti)ti.placeholder=en.includes('author')?'책 제목':'비워 두면 장소가 제목';
  $('#lbl-time').textContent=en.includes('end')?'시작시간':'시간';
  updDt();
}
function updChips(){
  const sh=S.sheet;if(!sh||sh.kind!=='rec')return;
  collectX();const x=sh.x||{};
  document.querySelectorAll('#xchips .xchip').forEach(b=>{const k=b.dataset.k;b.textContent=xChipText(k,x);b.classList.toggle('on',filledX(x,k));});
}
function updDur(){updChips();}
function growNote(){
  const el=$('#f-note');if(!el)return;
  el.style.height='auto';if(el.offsetParent===null)return;
  el.style.height=Math.min(el.scrollHeight+2,214)+'px';
}
function renderSheet(){
  const sh=S.sheet;if(!sh)return;
  $('#sheet').classList.toggle('mid',sh.kind==='view');
  $('#panel').classList.toggle('rec',sh.kind==='rec');
  $('#panel').innerHTML=sh.kind==='rec'?recFormHtml(sh):sh.kind==='view'?viewHtml(sh):sh.kind==='todo'?todoFormHtml(sh):catsHtml(sh);

function tiff(v,b){
  const le=v.getUint16(b)===0x4949,u16=o=>v.getUint16(b+o,le),u32=o=>v.getUint32(b+o,le);
  const ifd=o=>{const n=u16(o),t={};for(let i=0;i<n;i++){const e=o+2+i*12;if(b+e+12>v.byteLength)break;t[u16(e)]={n:u32(e+4),p:e+8};}return t;};
  const str=t=>{const o=t.n>4?u32(t.p):t.p;let s='';for(let i=0;i<t.n-1;i++)s+=String.fromCharCode(v.getUint8(b+o+i));return s;};
  const rat=(t,i)=>{const o=u32(t.p);return u32(o+i*8)/u32(o+i*8+4);};
  const i0=ifd(u32(4)),out={};
  if(i0[0x8769]){const ex=ifd(u32(i0[0x8769].p)),t=ex[0x9003]||ex[0x9004];
    if(t){const m=str(t).match(/^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/);if(m){out.date=m[1]+'-'+m[2]+'-'+m[3];out.time=m[4]+':'+m[5];}}}
  if(i0[0x8825]){const g=ifd(u32(i0[0x8825].p));
    if(g[2]&&g[4]){const dms=t=>rat(t,0)+rat(t,1)/60+rat(t,2)/3600;let la=dms(g[2]),lo=dms(g[4]);
      if(g[1]&&str(g[1])==='S')la=-la;if(g[3]&&str(g[3])==='W')lo=-lo;
      if(isFinite(la)&&isFinite(lo)&&(la||lo))out.geo={lat:+la.toFixed(5),lon:+lo.toFixed(5)};}}
  return (out.date||out.geo)?out:null;
}
function parseExif(buf){
  const v=new DataView(buf);if(v.byteLength<12||v.getUint16(0)!==0xFFD8)return null;
  let o=2;
  while(o+4<v.byteLength){
    const mk=v.getUint16(o),ln=v.getUint16(o+2);
    if(mk===0xFFE1&&v.getUint32(o+4)===0x45786966)return tiff(v,o+10);
    if((mk&0xFF00)!==0xFF00||mk===0xFFDA)break;
    o+=2+ln;
  }
  return null;
}
async function prepPhoto(file,max,q){
  let ex=null;
  try{ex=parseExif(await file.slice(0,262144).arrayBuffer());}catch(_){}
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'});}
  catch(_){bmp=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(file);});}
  const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,k=Math.min(1,max/Math.max(w,h));
  const cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));
  if(!blob)throw new Error('decode');
  return {blob:blob,ex:ex};
}
function applyExif(ex){
  const sh=S.sheet;if(!sh||sh.kind!=='rec')return;let used=false;

/* ---------- 백업 · 복원 ---------- */
function toMarkdown(){
  const dates=new Set();
  S.entries.forEach(e=>dates.add(e.date));S.todos.forEach(x=>{if(x.due)dates.add(x.due);});
  let s='# 하루장\n\n';
  Array.from(dates).sort().reverse().forEach(d=>{
    s+='## '+d+' ('+WD[pYmd(d).getDay()]+')\n\n';
    const ts=S.todos.filter(x=>x.due===d);
    if(ts.length){s+='할 일\n';ts.forEach(x=>{s+='- ['+(x.done?'x':' ')+'] '+x.title+'\n';});s+='\n';}
    S.entries.filter(e=>e.date===d).sort((a,b)=>(a.time||'').localeCompare(b.time||'')).forEach(e=>{
      s+='### '+(e.time||'')+' ['+catOf(e.cat).name+'] '+e.title+(e.star?' ★':'')+'\n';
      legacyFacts(e).forEach(x=>{s+='- '+x+'\n';});
      if(e.note)s+='\n'+e.note+'\n';
      if(e.photos&&e.photos.length)s+='\n사진 '+e.photos.length+'장 (백업 파일에만 포함)\n';
      s+='\n';
    });
  });
  const nd=S.todos.filter(x=>!x.due);
  if(nd.length){s+='## 날짜 없는 할 일\n\n';nd.forEach(x=>{s+='- ['+(x.done?'x':' ')+'] '+x.title+'\n';});s+='\n';}
  return s;
}
const toDataUrl=b=>typeof b==='string'?Promise.resolve(b):new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});
const fromDataUrl=async s=>{if(typeof s!=='string'||!s.startsWith('data:image/'))return null;const r=await fetch(s);return r.blob();};
function saveBlob(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},5000);
}
async function doExport(kind){
  const stamp=ymd(new Date()).replace(/-/g,'');
  try{
    if(kind==='json'){
      const entries=await Promise.all(S.entries.map(async e=>Object.assign({},e,{photos:await Promise.all((e.photos||[]).map(toDataUrl))})));
      const text=JSON.stringify({app:'하루장',version:2,exportedAt:new Date().toISOString(),categories:S.cats,todos:S.todos,entries:entries});
      saveBlob(new Blob([text],{type:'application/json'}),'harujang-backup-'+stamp+'.json');

    }else{

const okDate=s=>typeof s==='string'&&/^\d{4}-\d\d-\d\d$/.test(s);
async function doImport(file){
  let data;
  try{data=JSON.parse(await file.text());}catch(_){toast('백업 파일을 읽지 못했습니다.');return;}
  const list=Array.isArray(data)?data:(data&&data.entries);
  if(!Array.isArray(list)){toast('하루장 백업 파일이 아닙니다.');return;}
  let n=0,skip=0,catsChanged=false;
  if(data&&Array.isArray(data.categories)){
    for(const c of data.categories){
      if(c&&typeof c.id==='string'&&typeof c.name==='string'&&!S.cats.some(x=>x.id===c.id)){
        S.cats.push({id:c.id,name:c.name.slice(0,10),color:COLORS.includes(c.color)?c.color:'slate',fields:Array.isArray(c.fields)?FIELD_ORDER.filter(k=>c.fields.includes(k)):(ID_PRESET[c.id]||[]).slice()});catsChanged=true;}
    }
    ensureEtc();
  }
  if(catsChanged){try{await saveCats();}catch(_){}}
  for(const raw of list){
    try{
      if(!raw||typeof raw.id!=='string'||typeof raw.title!=='string'||!okDate(raw.date)){skip++;continue;}
      const old=S.entries.find(x=>x.id===raw.id);
      if(old&&(old.updatedAt||0)>=(raw.updatedAt||0)){skip++;continue;}
      const photos=(await Promise.all((Array.isArray(raw.photos)?raw.photos:[]).map(fromDataUrl))).filter(Boolean);
      const e=normEntry({id:raw.id,cat:typeof raw.cat==='string'?raw.cat:'etc',title:raw.title.slice(0,80),date:raw.date,
        time:/^\d\d:\d\d$/.test(raw.time||'')?raw.time:'00:00',note:typeof raw.note==='string'?raw.note:'',
        f:(raw.f&&typeof raw.f==='object')?raw.f:{},photos:photos,tags:Array.isArray(raw.tags)?raw.tags.map(String):[],
        star:[1,2,3].includes(raw.star)?raw.star:0,createdAt:Number(raw.createdAt)||Date.now(),updatedAt:Number(raw.updatedAt)||Date.now()});
      if(raw.geo&&isFinite(raw.geo.lat)&&isFinite(raw.geo.lon))e.geo={lat:Number(raw.geo.lat),lon:Number(raw.geo.lon)};
      await putEntry(e);n++;
    }catch(_){skip++;}
  }
  let tn=0;
  if(data&&Array.isArray(data.todos)){
    for(const raw of data.todos){
      try{
        if(!raw||typeof raw.id!=='string'||typeof raw.title!=='string'){skip++;continue;}
        const old=S.todos.find(x=>x.id===raw.id);
        if(old&&(old.updatedAt||0)>=(raw.updatedAt||0)){skip++;continue;}
        await putTodo({id:raw.id,title:raw.title.slice(0,80),due:okDate(raw.due)?raw.due:'',done:!!raw.done,doneDate:okDate(raw.doneDate)?raw.doneDate:null,
          doneAt:Number(raw.doneAt)||null,createdAt:Number(raw.createdAt)||Date.now(),updatedAt:Number(raw.updatedAt)||Date.now()});tn++;
      }catch(_){skip++;}
    }
  }
  render();
  toast('기록 '+n+'건'+(tn?', 할 일 '+tn+'개':'')+'를 불러왔습니다'+(skip?' (건너뜀 '+skip+')':''));
}

  const a=t.dataset.act;
  switch(a){
    case 'tab':S.tab=t.dataset.tab;render();window.scrollTo(0,0);break;
    case 'rec-new':openRec(null);break;
    case 'todo-new':openSheet({kind:'todo',todo:null,arm:false});break;
    case 'rec-open':{const e=S.entries.find(x=>x.id===t.dataset.id);if(e)openView(e);break;}
    case 'rec-edit':editFromView();break;
    case 'todo-edit':{const x=S.todos.find(y=>y.id===t.dataset.id);if(x)openSheet({kind:'todo',todo:x,arm:false});break;}
    case 'todo-toggle':toggleTodo(t.dataset.id);break;
    case 'close':closeSheet();break;
    case 'setcat':{const sh=S.sheet;if(sh){sh.cat=t.dataset.id;document.querySelectorAll('.cp[data-id]').forEach(b=>{const on=b.dataset.id===sh.cat;b.classList.toggle('on',on);b.setAttribute('aria-checked',String(on));});collectX();renderExtra();}break;}
    case 'cat-more':{const sh=S.sheet;if(sh&&sh.kind==='rec'){sh.catAll=!sh.catAll;$('#catpick').innerHTML=catChipsHtml(sh);}break;}
    case 'dt-toggle':{const box=$('#dt-box'),btn=$('#dtline');if(box&&btn){box.hidden=!box.hidden;btn.setAttribute('aria-expanded',String(!box.hidden));}break;}
    case 'x-chip':{
      const sh=S.sheet,k=t.dataset.k;if(!sh||sh.kind!=='rec')break;
      collectX();sh.xopen=sh.xopen||{};sh.xopen[k]=!sh.xopen[k];renderExtra();
      const ids={dist:'#f-dist',cost:'#f-cost',author:'#f-author'};
      if(sh.xopen[k]&&ids[k]){const el=$(ids[k]);if(el)el.focus();}
      break;}
    case 'far-toggle':S.far=!S.far;render();break;
    case 'filter':S.cat=t.dataset.cat;render();break;
    case 'day':S.day=(S.day===t.dataset.date)?null:t.dataset.date;render();break;
    case 'mon':{let m=S.cal.m+Number(t.dataset.d),y=S.cal.y;if(m<0){m=11;y--;}if(m>11){m=0;y++;}S.cal={y:y,m:m};S.day=null;render();break;}
    case 'imp':{const b=$('#f-star'),on=b.dataset.v!=='1';b.dataset.v=on?'1':'0';b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));b.textContent=(on?'★':'☆')+' 중요';break;}
    case 'imp-filter':S.imp=!S.imp;render();break;
    case 'rm-photo':{const sh=S.sheet;if(sh){sh.photos.splice(Number(t.dataset.i),1);renderStrip();}break;}
    case 'geo-clear':if(S.sheet){S.sheet.geo=null;renderGeo();}break;
    case 'rec-del':delRec();break;
    case 'todo-del':delTodoUi();break;
    case 'due-set':{const el=$('#t-due'),n=Number(t.dataset.n);el.value=n<0?'':addDays(ymd(new Date()),n);break;}
    case 'photo':{const e=S.entries.find(x=>x.id===t.dataset.id);if(e&&e.photos[Number(t.dataset.i)])showLb(urlOf(e.photos[Number(t.dataset.i)]));break;}
    case 'lb-close':hideLb();break;
    case 'export':doExport(t.dataset.kind);break;
    case 'install':if(deferred){deferred.prompt();deferred.userChoice.finally(()=>{deferred=null;render();});}break;
    case 'snack-ok':{const s=S.snack;hideSnack();if(s)openRec(null,{title:s.title});break;}
    case 'snack-no':hideSnack();break;
    case 'cats-open':openSheet({kind:'cats',open:null});break;
    case 'cat-color':{const sh=S.sheet;if(sh){sh.open=(sh.open===t.dataset.id)?null:t.dataset.id;renderSheet();}break;}
    case 'cat-sw':{const c=S.cats.find(x=>x.id===t.dataset.id);if(c){c.color=t.dataset.color;renderSheet();catChanged();}break;}
    case 'cat-add':{
      const used=new Set(S.cats.map(c=>c.color)),color=COLORS.find(k=>!used.has(k))||COLORS[S.cats.length%COLORS.length];
      const c={id:'c'+newId(),name:'새 분류',color:color,fields:[],fresh:true};S.cats.push(c);renderSheet();catChanged();
      setTimeout(()=>{const el=document.querySelector('[data-cat-name="'+c.id+'"]');if(el){el.focus();el.select();}},40);break;}
    case 'cat-fields':{const sh=S.sheet;if(sh){sh.fopen=(sh.fopen===t.dataset.id)?null:t.dataset.id;renderSheet();}break;}
    case 'cat-field':{
      const c=S.cats.find(x=>x.id===t.dataset.id),k=t.dataset.f;if(!c||!FIELD_ORDER.includes(k))break;
      const cur=fieldsOf(c).slice(),i=cur.indexOf(k);if(i<0)cur.push(k);else cur.splice(i,1);
      c.fields=FIELD_ORDER.filter(f=>cur.includes(f));delete c.fresh;renderSheet();catChanged();break;}
    case 'cat-del':{
      const sh=S.sheet,c=S.cats.find(x=>x.id===t.dataset.id);if(!sh||!c)break;
      if(sh.armCat!==c.id){sh.armCat=c.id;t.textContent='지움?';t.classList.add('arm');setTimeout(()=>{if(S.sheet===sh&&sh.armCat===c.id){sh.armCat=null;if(t.isConnected){t.textContent='×';t.classList.remove('arm');}}},3000);break;}
      removeCat(c.id);break;}
  }
});
document.addEventListener('input',ev=>{
  const id=ev.target&&ev.target.id;
  if(id==='f-end'||id==='f-time'||id==='f-dist'||id==='f-cost'||id==='f-author')updDur();
  if(id==='f-date'||id==='f-time')updDt();
  if(id==='f-place'||id==='f-dist'||id==='f-end'||id==='f-cost'||id==='f-author')collectX();
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){if(!$('#lb').hidden)hideLb();else if(S.sheet)closeSheet();}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&ev.target.classList.contains('card')){ev.preventDefault();ev.target.click();}
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='q'){S.q=t.value;$('#feed').innerHTML=feedHtml();return;}
  const sh=S.sheet;if(!sh)return;
  if(t.id==='f-title')$('#err-title').hidden=true;
  else if(t.id==='f-note')growNote();
  else if(t.id==='t-title')$('#err-t').hidden=true;
  else if((t.id==='f-date'||t.id==='f-time')&&sh.kind==='rec')sh.touched.dt=true;
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='f-date'||t.id==='f-time')updDt();
  if(t.id==='f-cam'||t.id==='f-pic'){addFiles(t.files);t.value='';}
  else if(t.id==='imp'){const f=t.files&&t.files[0];t.value='';if(f)doImport(f);}
  else if(t.dataset&&t.dataset.catName){
    const c=S.cats.find(x=>x.id===t.dataset.catName);if(!c)return;
    const v=t.value.trim();
    if(!v){t.value=c.name;return;}
    c.name=v.slice(0,10);
    if(c.fresh){
      /* 새로 만든 분류의 첫 이름에서만 추천 항목을 채운다. 이후 이름을 바꿔도 항목은 유지 */
      delete c.fresh;
      const pf=presetOf(c.name);
      if(pf.length){c.fields=pf;if(S.sheet&&S.sheet.kind==='cats')S.sheet.fopen=c.id;toast('추천 항목을 채웠습니다: '+pf.map(k=>FIELD_DEFS[k]).join(', '));}
      catChanged();if(S.sheet&&S.sheet.kind==='cats')renderSheet();return;
    }
    catChanged();
  }
});
document.addEventListener('submit',ev=>{
  if(ev.target.id==='f'){ev.preventDefault();saveRec();}
  else if(ev.target.id==='tf'){ev.preventDefault();saveTodo();}
});
$('#sheet').addEventListener('click',ev=>{if(ev.target.id==='sheet')closeSheet();});

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});
}
init();
})();

</script>
</body>
</html>
